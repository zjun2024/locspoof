name: Build Tweak

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl build-essential fakeroot dpkg-dev libssl-dev procps clang lld llvm
          sudo ln -sf /usr/bin/fakeroot-sysv /usr/local/bin/fakeroot || true

      - name: Setup theos
        run: |
          sudo rm -rf /opt/theos
          git clone --recursive --depth 1 https://github.com/theos/theos /opt/theos
          echo "THEOS=/opt/theos" >> $GITHUB_ENV
          echo "THEOS_DEVICE_IP=127.0.0.1" >> $GITHUB_ENV

      - name: Link clang for theos
        run: |
          CLANG_BIN=$(command -v clang || ls /usr/bin/clang-* 2>/dev/null | head -1)
          echo "using clang: $CLANG_BIN"
          sudo mkdir -p /opt/theos/toolchain/linux/iphone/bin
          sudo ln -sf "$CLANG_BIN" /opt/theos/toolchain/linux/iphone/bin/clang
          sudo ln -sf "$CLANG_BIN" /opt/theos/toolchain/linux/iphone/bin/clang++
          ls -la /opt/theos/toolchain/linux/iphone/bin/

      - name: Install iOS SDK
        run: |
          mkdir -p /opt/theos/sdks
          cd /tmp
          curl -L -o sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q sdks.zip
          cp -r sdks-master/*.sdk /opt/theos/sdks/ || true
          ls /opt/theos/sdks/

      - name: Build package
        run: |
          # 确保 theos 能调用 ld64.lld（LLVM 的 Mach-O 链接器）
          sudo mkdir -p /opt/theos/toolchain/linux/iphone/bin
          if [ ! -e /opt/theos/toolchain/linux/iphone/bin/ld64.lld ]; then
            if command -v ld64.lld >/dev/null 2>&1; then
              sudo ln -sf "$(command -v ld64.lld)" /opt/theos/toolchain/linux/iphone/bin/ld64.lld
            else
              # 用 lld 代替
              sudo ln -sf "$(command -v lld)" /opt/theos/toolchain/linux/iphone/bin/ld64.lld
            fi
          fi
          ls -la /opt/theos/toolchain/linux/iphone/bin/
          make clean
          make package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: locationSpoof-deb
          path: packages/*.deb
